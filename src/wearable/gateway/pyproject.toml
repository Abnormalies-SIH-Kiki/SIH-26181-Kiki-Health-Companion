[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kiki-esp32-gateway"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "onnxruntime>=1.20",
  "scikit-learn>=1.5",
  "scipy>=1.12",
  "tqdm>=4.66",
  "requests>=2.32",
  "websockets>=15.0",
  "pyrnnoise>=0.3",
  "yt-dlp>=2025.1",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
kiki-esp32-gateway = "kiki_gateway.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kiki_gateway*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
