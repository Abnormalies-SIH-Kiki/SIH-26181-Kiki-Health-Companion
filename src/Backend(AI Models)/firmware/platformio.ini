; PlatformIO project config
; Board: any ESP32-WROOM class board (520KB SRAM). Swap board id for your hardware.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    tanakamasayuki/TensorFlowLite_ESP32@^1.0.0
    bblanchon/ArduinoJson@^7.0.4
