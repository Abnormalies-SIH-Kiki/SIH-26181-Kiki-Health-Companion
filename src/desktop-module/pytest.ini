[pytest]
# `pytest` with no arguments used to walk the whole repo, which meant it collected
# the parked scratch scripts under to_do/ (to_do/pet_test.py, orphan_scripts/test*.py).
# Those are frozen code with no test intent and they fail on import off-robot.
# Pin collection to the real suite so a bare `pytest` and `pytest tests/` agree.
testpaths = tests
norecursedirs = to_do whisper.cpp whatsapp-mcp backups skills logs conversations .git *.egg

# tests/ also holds three operator tools that are not tests and must not be collected:
# streaming_tts.py (filler-wav generator), calibrate_lcd_sync.py (run at boot by
# core/startup_config.py) and bench_action_agent.py (provider benchmark).
python_files = test_*.py
