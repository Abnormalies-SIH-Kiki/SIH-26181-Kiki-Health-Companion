 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div><div class="w-full flex items-center gap-inline-gutter pt-2"><div class="flex-1 h-1 bg-surface-container-highest rounded-full overflow-hidden"><div class="h-full w-2/5 bg-tertiary-fixed rounded-full" style="background-color: rgb(255, 112, 52);"></div></div><span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">STEP 2/5</span></div></div></header><main class="flex flex-col relative w-full pt-20 pb-safe bg-surface"><div class="flex flex-col w-full px-container-padding pb-section-margin">
<div class="flex flex-col items-center text-center mt-2 mb-stack-gap">
<div class="relative flex items-center justify-center w-24 h-24 mb-4">
<div class="absolute inset-0 rounded-full bg-tertiary/20 blur-xl" style="background-color: rgba(255, 112, 52, 0.25);"></div>
<div class="relative w-16 h-16 rounded-full bg-surface-container-high flex items-center justify-center shadow-lg shadow-tertiary/10">
<span class="material-symbols-outlined text-tertiary text-[32px]" style="color: rgb(255, 112, 52); font-variation-settings: &quot;FILL&quot; 1;">local_fire_department</span>
</div>
</div>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight mb-1" style="font-family: Inter, sans-serif; font-weight: 700;">
      Set your daily goals
    </span>
<span class="font-body-md text-body-md text-on-surface-variant" style="font-family: Inter, sans-serif; font-weight: 400;">
      You can update these anytime.
    </span>
</div>
<div class="flex flex-col gap-stack-gap w-full">
<!-- Daily Steps Goal Card -->
<div class="w-full bg-surface-container rounded-lg p-5 flex flex-col shadow-md relative overflow-hidden">
<div class="flex items-center justify-between mb-4">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-tertiary-container flex items-center justify-center" style="background-color: rgba(255, 112, 52, 0.15);">
<span class="material-symbols-outlined text-tertiary-fixed-dim text-[22px]" style="color: rgb(255, 112, 52);">directions_walk</span>
</div>
<div class="flex flex-col">
<span class="font-headline-md text-numeric-data text-on-surface font-semibold" style="font-family: Inter, sans-serif; font-weight: 600;">Daily Steps</span>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" style="font-family: Inter, sans-serif; font-weight: 500;">Baseline target</span>
</div>
</div>
<!-- Mini circular ring progress -->
<div class="relative w-11 h-11 flex items-center justify-center">
<svg class="w-full h-full -rotate-90" viewBox="0 0 44 44">
<circle class="text-surface-container-highest" cx="22" cy="22" fill="none" r="17" stroke="currentColor" stroke-width="4"></circle>
<circle class="text-tertiary-fixed-dim transition-all duration-300" cx="22" cy="22" fill="none" id="steps-ring" r="17" stroke="currentColor" stroke-dasharray="106.8" stroke-dashoffset="35.6" stroke-linecap="round" stroke-width="4" style="stroke: rgb(255, 112, 52);"></circle>
</svg>
<span class="material-symbols-outlined absolute text-[14px] text-tertiary-fixed-dim" style="color: rgb(255, 112, 52);">done</span>
</div>
</div>
<div class="flex items-baseline gap-2 mb-5"><span class="font-display-stat text-display-stat text-on-surface tracking-tight whitespace-nowrap" id="steps-display" style="font-family: Inter, sans-serif; font-weight: 700; font-size: 40px; line-height: 1; font-feature-settings: &quot;tnum&quot;, &quot;lnum&quot;; letter-spacing: -0.03em;">8,000</span>
<span class="font-body-md text-on-surface-variant whitespace-nowrap" style="font-weight: 500; font-size: 14px;">steps / day</span></div>
<!-- Quick select chips -->
<div class="grid grid-cols-4 gap-2" id="steps-chips" style="font-family: Inter, sans-serif; font-weight: 500;"><button class="step-chip py-2.5 px-1 rounded-full text-center transition-all duration-200 active:scale-95 text-xs font-semibold" data-offset="53.4" data-val="5,000" style="background-color: rgba(255, 255, 255, 0.05); color: rgb(196, 196, 196); border: 1px solid rgba(255, 255, 255, 0.08); font-family: Inter, sans-serif;" type="button">5,000</button><button class="step-chip py-2.5 px-1 rounded-full text-center transition-all duration-200 active:scale-95 text-xs font-bold shadow-md" data-offset="35.6" data-val="8,000" style="background-color: rgb(255, 112, 52); color: rgb(19, 19, 19); border: 1px solid rgb(255, 112, 52); box-shadow: rgba(255, 112, 52, 0.4) 0px 4px 14px; font-family: Inter, sans-serif;" type="button">8,000</button><button class="step-chip py-2.5 px-1 rounded-full text-center transition-all duration-200 active:scale-95 text-xs font-semibold" data-offset="20.0" data-val="10,000" style="background-color: rgba(255, 255, 255, 0.05); color: rgb(196, 196, 196); border: 1px solid rgba(255, 255, 255, 0.08); font-family: Inter, sans-serif;" type="button">10,000</button><button class="step-chip py-2.5 px-1 rounded-full text-center transition-all duration-200 active:scale-95 text-xs font-semibold" data-offset="0.0" data-val="12,000" style="background-color: rgba(255, 255, 255, 0.05); color: rgb(196, 196, 196); border: 1px solid rgba(255, 255, 255, 0.08); font-family: Inter, sans-serif;" type="button">12,000</button></div>
</div>
<!-- Calories Goal Card -->
<div class="w-full bg-surface-container rounded-lg p-5 flex flex-col shadow-md relative overflow-hidden">
<div class="flex items-center justify-between mb-4">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center">
<span class="material-symbols-outlined text-secondary-fixed text-[22px]" style="font-variation-settings: 'FILL' 1;">mode_heat</span>
</div>
<div class="flex flex-col">
<span class="font-headline-md text-numeric-data text-on-surface font-semibold" style="font-family: Inter, sans-serif; font-weight: 600;">Calories to Burn</span>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" style="font-family: Inter, sans-serif; font-weight: 500;">Active burn target</span>
</div>
</div>
<!-- Mini circular ring progress -->
<div class="relative w-11 h-11 flex items-center justify-center">
<svg class="w-full h-full -rotate-90" viewBox="0 0 44 44">
<circle class="text-surface-container-highest" cx="22" cy="22" fill="none" r="17" stroke="currentColor" stroke-width="4"></circle>
<circle class="text-secondary-fixed transition-all duration-300" cx="22" cy="22" fill="none" id="cal-ring" r="17" stroke="currentColor" stroke-dasharray="106.8" stroke-dashoffset="48.0" stroke-linecap="round" stroke-width="4"></circle>
</svg>
<span class="material-symbols-outlined absolute text-[14px] text-secondary">bolt</span>
</div>
</div>
<div class="flex items-baseline gap-2 mb-5"><span class="font-display-stat text-display-stat text-on-surface tracking-tight whitespace-nowrap" id="cal-display" style="font-family: Inter, sans-serif; font-weight: 700; font-size: 40px; line-height: 1; font-feature-settings: &quot;tnum&quot;, &quot;lnum&quot;; letter-spacing: -0.03em;">500</span>
<span class="font-body-md text-on-surface-variant whitespace-nowrap" style="font-weight: 500; font-size: 14px;">kcal / day</span></div>
<!-- Quick select chips -->
<div class="grid grid-cols-4 gap-2" id="cal-chips" style="font-family: Inter, sans-serif; font-weight: 500;"><button class="cal-chip py-2.5 px-1 rounded-full text-center transition-all duration-200 active:scale-95 text-xs font-semibold" data-offset="72.0" data-val="300" style="background-color: rgba(255, 255, 255, 0.05); color: rgb(196, 196, 196); border: 1px solid rgba(255, 255, 255, 0.08); font-family: Inter, sans-serif;" type="button">300</button><button class="cal-chip py-2.5 px-1 rounded-full text-center transition-all duration-200 active:scale-95 text-xs font-bold shadow-md" data-offset="48.0" data-val="500" style="background-color: rgb(255, 112, 52); color: rgb(19, 19, 19); border: 1px solid rgb(255, 112, 52); box-shadow: rgba(255, 112, 52, 0.4) 0px 4px 14px; font-family: Inter, sans-serif;" type="button">500</button><button class="cal-chip py-2.5 px-1 rounded-full text-center transition-all duration-200 active:scale-95 text-xs font-semibold" data-offset="24.0" data-val="700" style="background-color: rgba(255, 255, 255, 0.05); color: rgb(196, 196, 196); border: 1px solid rgba(255, 255, 255, 0.08); font-family: Inter, sans-serif;" type="button">700</button><button class="cal-chip py-2.5 px-1 rounded-full text-center transition-all duration-200 active:scale-95 text-xs font-semibold" data-offset="0.0" data-val="900" style="background-color: rgba(255, 255, 255, 0.05); color: rgb(196, 196, 196); border: 1px solid rgba(255, 255, 255, 0.08); font-family: Inter, sans-serif;" type="button">900</button></div>
</div>
</div>
<div class="w-full flex flex-col items-center mt-section-margin gap-3">
<button class="w-full py-4 rounded-DEFAULT bg-on-surface text-on-primary font-headline-md text-body-lg font-semibold flex items-center justify-center gap-2 shadow-lg shadow-surface-tint/10 active:scale-[0.98] transition-transform" id="save-goals-btn" style="background-color: rgb(255, 112, 52); color: rgb(19, 19, 19); box-shadow: rgba(255, 112, 52, 0.35) 0px 4px 20px; font-family: Inter, sans-serif; font-weight: 600; white-space: nowrap;" type="button">
<span class="">Save goals &amp; continue</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
<script>
  (function() {
    const stepChips = document.querySelectorAll('.step-chip');
    const stepsDisplay = document.getElementById('steps-display');
    const stepsRing = document.getElementById('steps-ring');

    stepChips.forEach(chip => {
      chip.addEventListener('click', () => {
        stepChips.forEach(c => {
          c.classList.remove('bg-tertiary', 'text-on-tertiary', 'font-bold', 'shadow-md', 'shadow-tertiary/20');
          c.classList.add('bg-surface-container-high', 'text-on-surface');
        });
        chip.classList.remove('bg-surface-container-high', 'text-on-surface');
        chip.classList.add('bg-tertiary', 'text-on-tertiary', 'font-bold', 'shadow-md', 'shadow-tertiary/20');

        if (stepsDisplay) stepsDisplay.textContent = chip.dataset.val;
        if (stepsRing) stepsRing.style.strokeDashoffset = chip.dataset.offset;
      });
    });

    const calChips = document.querySelectorAll('.cal-chip');
    const calDisplay = document.getElementById('cal-display');
    const calRing = document.getElementById('cal-ring');

    calChips.forEach(chip => {
      chip.addEventListener('click', () => {
        calChips.forEach(c => {
          c.classList.remove('bg-secondary-fixed', 'text-on-secondary-fixed', 'font-bold', 'shadow-md', 'shadow-secondary/20');
          c.classList.add('bg-surface-container-high', 'text-on-surface');
        });
        chip.classList.remove('bg-surface-container-high', 'text-on-surface');
        chip.classList.add('bg-secondary-fixed', 'text-on-secondary-fixed', 'font-bold', 'shadow-md', 'shadow-secondary/20');

        if (calDisplay) calDisplay.textContent = chip.dataset.val;
        if (calRing) calRing.style.strokeDashoffset = chip.dataset.offset;
      });
    });
  })();
</script></main>


</body></html>
