<!DOCTYPE html><html class="dark" lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..900;1,300..900&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

d":"#131313"},"borderRadius":{"DEFAULT":"1rem","lg":"2rem","xl":"3rem","full":"9999px"},"spacing":{"container-padding":"20px","stack-gap":"16px","inline-gutter":"12px","section-margin":"32px"},"fontFamily":{"body-lg":["hankenGrotesk"],"label-caps":["hankenGrotesk"],"body-md":["hankenGrotesk"],"headline-lg-mobile":["hankenGrotesk"],"numeric-data":["hankenGrotesk"],"headline-lg":["hankenGrotesk"],"display-stat":["hankenGrotesk"],"headline-md":["hankenGrotesk"]},"fontSize":{"body-lg":["18px",{"lineHeight":"28px","letterSpacing":"0em","fontWeight":"400"}],"label-caps":["12px",{"lineHeight":"16px","letterSpacing":"0.08em","fontWeight":"700"}],"body-md":["16px",{"lineHeight":"24px","letterSpacing":"0em","fontWeight":"400"}],"headline-lg-mobile":["28px",{"lineHeight":"34px","letterSpacing":"-0.02em","fontWeight":"600"}],"numeric-data":["20px",{"lineHeight":"24px","letterSpacing":"-0.01em","fontWeight":"500"}],"headline-lg":["32px",{"lineHeight":"40px","letterSpacing":"-0.02em","fontWeight":"600"}],"display-stat":["48px",{"lineHeight":"56px","letterSpacing":"-0.04em","fontWeight":"700"}],"headline-md":["24px",{"lineHeight":"30px","letterSpacing":"-0.01em","fontWeight":"600"}]}}}};</script></head><body class="bg-background text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-20 px-container-padding flex flex-col justify-center"><div class="flex items-center justify-between"><button aria-label="Go back" class="w-11 h-11 flex items-center justify-center -ml-2 rounded-full text-on-surface-variant hover:text-on-surface transition-colors" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><span class="font-headline-md text-headline-md text-on-surface text-center">Personal Profile</span><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div><div class="w-full flex items-center gap-inline-gutter pt-2"><div class="flex-1 h-1 bg-surface-container-highest rounded-full overflow-hidden"><div class="h-full w-2/5 bg-tertiary-fixed rounded-full"></div></div><span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">STEP 2/5</span></div></div></header><main class="flex flex-col relative w-full pt-20 pb-safe bg-surface"><div class="flex flex-col w-full px-container-padding pb-8">
<!-- Friendly Glowing Mascot Aura -->
<div class="flex flex-col items-center justify-center pt-2 pb-5">
<div class="relative flex items-center justify-center w-24 h-24">
<div class="absolute inset-0 rounded-full bg-secondary-container opacity-40 blur-xl"></div>
<div class="relative w-20 h-20 rounded-full bg-surface-container-high flex items-center justify-center shadow-lg">
<svg class="w-12 h-12 text-tertiary-fixed drop-shadow-[0_0_12px_rgba(114,254,136,0.45)]" fill="none" viewBox="0 0 48 48">
<circle cx="24" cy="24" fill="currentColor" fill-opacity="0.12" r="20"></circle>
<path d="M16 23C17.1046 23 18 22.1046 18 21C18 19.8954 17.1046 19 16 19C14.8954 19 14 19.8954 14 21C14 22.1046 14.8954 23 16 23Z" fill="currentColor"></path>
<path d="M32 23C33.1046 23 34 22.1046 34 21C34 19.8954 33.1046 19 32 19C30.8954 19 30 19.8954 30 21C30 22.1046 30.8954 23 32 23Z" fill="currentColor"></path>
<path d="M17 28C18.5 32 21 34 24 34C27 34 29.5 32 31 28" stroke="currentColor" stroke-linecap="round" stroke-width="2.5"></path>
</svg>
<span class="absolute -top-1 -right-1 material-symbols-outlined text-tertiary-fixed text-[18px] animate-pulse">arrow_back_ios_new</span>
</div>
</div>
<div class="text-center mt-3">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Let’s get to know you</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">A few details help us personalise your daily targets.</p>
</div>
</div>
<!-- Form Stack -->
<div class="flex flex-col gap-y-5">
<!-- 1. Full Name Input -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="full-name-input">Full Name</label>
<div class="relative flex items-center bg-surface-container rounded-DEFAULT px-4 py-3.5 shadow-sm">
<span class="material-symbols-outlined text-on-surface-variant text-[20px] mr-3">badge</span>
<input class="bg-transparent font-body-md text-body-md text-on-surface w-full focus:outline-none placeholder-on-surface-variant/50" id="full-name-input" placeholder="e.g. Alex Lawson" type="text" value="Alex Lawson">
<span class="material-symbols-outlined text-tertiary text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
<!-- 2. Gender Selection -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Gender</label>
<div aria-label="Gender selection" class="grid grid-cols-2 gap-3" id="gender-group" role="radiogroup">
<button aria-checked="false" class="gender-pill flex items-center justify-between px-4 py-3.5 rounded-DEFAULT bg-surface-container text-on-surface transition-all active:scale-[0.98] min-h-[52px]" onclick="selectGender(this)" role="radio" type="button">
<span class="font-body-md text-body-md font-medium">Woman</span>
<span class="w-4 h-4 rounded-full bg-surface-container-highest flex items-center justify-center dot-indicator"></span>
</button>
<button aria-checked="true" class="gender-pill flex items-center justify-between px-4 py-3.5 rounded-DEFAULT bg-surface-container-high text-tertiary font-semibold transition-all active:scale-[0.98] min-h-[52px]" onclick="selectGender(this)" role="radio" type="button">
<span class="font-body-md text-body-md font-semibold">Man</span>
<span class="w-4 h-4 rounded-full bg-tertiary flex items-center justify-center dot-indicator">
<span class="w-1.5 h-1.5 rounded-full bg-on-tertiary"></span>
</span>
</button>
<button aria-checked="false" class="gender-pill flex items-center justify-between px-4 py-3.5 rounded-DEFAULT bg-surface-container text-on-surface transition-all active:scale-[0.98] min-h-[52px]" onclick="selectGender(this)" role="radio" type="button">
<span class="font-body-md text-body-md font-medium">Non-binary</span>
<span class="w-4 h-4 rounded-full bg-surface-container-highest flex items-center justify-center dot-indicator"></span>
</button>
<button aria-checked="false" class="gender-pill flex items-center justify-between px-4 py-3.5 rounded-DEFAULT bg-surface-container text-on-surface transition-all active:scale-[0.98] min-h-[52px]" onclick="selectGender(this)" role="radio" type="button">
<span class="font-body-md text-body-md font-medium truncate">Prefer not to say</span>
<span class="w-4 h-4 rounded-full bg-surface-container-highest flex items-center justify-center dot-indicator shrink-0"></span>
</button>
</div>
</div>
<!-- 3. Age Stepper Card -->
<div class="flex flex-col gap-2"><div class="flex items-center justify-between"><label class="text-[11px] text-[#a09aab] uppercase tracking-wider" style="font-family: 'Inter', sans-serif; font-weight: 600;">AGE</label><span class="text-[13px] text-[#c77dff] font-medium" style="font-family: 'Inter', sans-serif;"><span id="age-display" class="text-white font-bold text-[15px]">28</span> years old</span></div><div class="relative flex items-center justify-center rounded-2xl p-4 border border-[#2d2540] shadow-sm overflow-hidden" style="background-color: #1a1625;"><div class="absolute inset-x-0 h-11 pointer-events-none rounded-xl border border-[#7b2cbf]/50 shadow-[0_0_15px_rgba(123,44,191,0.25)]" style="background-color: rgba(74, 25, 133, 0.25);"></div><div class="flex items-center justify-between w-full max-w-[280px] z-10 select-none"><button type="button" onclick="adjustAge(-1)" class="w-8 h-8 rounded-full flex items-center justify-center text-[#a09aab] hover:text-white transition-colors"><span class="material-symbols-outlined text-[20px]">chevron_left</span></button><div class="flex items-center justify-center gap-4 flex-1"><span class="text-[15px] text-[#756f82] font-medium cursor-pointer transition-colors" onclick="currentAge=26; document.getElementById('age-display').textContent=26;">26</span><span class="text-[18px] text-[#a09aab] font-medium cursor-pointer transition-colors" onclick="currentAge=27; document.getElementById('age-display').textContent=27;">27</span><span class="text-[24px] text-white font-bold px-3 py-0.5 rounded-lg drop-shadow-[0_0_8px_rgba(199,125,255,0.6)]">28</span><span class="text-[18px] text-[#a09aab] font-medium cursor-pointer transition-colors" onclick="currentAge=29; document.getElementById('age-display').textContent=29;">29</span><span class="text-[15px] text-[#756f82] font-medium cursor-pointer transition-colors" onclick="currentAge=30; document.getElementById('age-display').textContent=30;">30</span></div><button type="button" onclick="adjustAge(1)" class="w-8 h-8 rounded-full flex items-center justify-center text-[#a09aab] hover:text-white transition-colors"><span class="material-symbols-outlined text-[20px]">chevron_right</span></button></div></div></div>
<!-- Privacy Micro-Note -->
<div class="flex items-center gap-2 px-1">
<span class="material-symbols-outlined text-on-surface-variant text-[16px]">lock</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">Your biometric details remain strictly on-device.</span>
</div>
</div>
<!-- Primary Docked CTA -->
<div class="w-full pt-8 pb-4">
<button class="w-full py-4 px-6 rounded-DEFAULT bg-primary-fixed text-on-primary-fixed font-headline-md text-headline-md flex items-center justify-center gap-2 active:scale-[0.98] transition-transform shadow-md" type="button">
<span class="">Continue</span>
<span class="material-symbols-outlined text-[22px]">arrow_forward</span>
</button>
</div>
</div>
<script>
  let currentAge = 28;

  function adjustAge(delta) {
    currentAge = Math.max(14, Math.min(100, currentAge + delta));
    const ageEl = document.getElementById('age-display');
    if (ageEl) {
      ageEl.textContent = currentAge;
    }
  }

  function selectGender(button) {
    const pills = document.querySelectorAll('.gender-pill');
    pills.forEach(pill => {
      pill.setAttribute('aria-checked', 'false');
      pill.className = 'gender-pill flex items-center justify-between px-4 py-3.5 rounded-DEFAULT bg-surface-container text-on-surface transition-all active:scale-[0.98] min-h-[52px]';
      const indicator = pill.querySelector('.dot-indicator');
      if (indicator) {
        indicator.className = 'w-4 h-4 rounded-full bg-surface-container-highest flex items-center justify-center dot-indicator';
        indicator.innerHTML = '';
      }
    });

    button.setAttribute('aria-checked', 'true');
    button.className = 'gender-pill flex items-center justify-between px-4 py-3.5 rounded-DEFAULT bg-surface-container-high text-tertiary font-semibold transition-all active:scale-[0.98] min-h-[52px]';
    const activeDot = button.querySelector('.dot-indicator');
    if (activeDot) {
      activeDot.className = 'w-4 h-4 rounded-full bg-tertiary flex items-center justify-center dot-indicator';
      activeDot.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-on-tertiary"></span>';
    }
  }
</script></main>

</body></html>
